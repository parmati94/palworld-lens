# Schema for player data extraction
# Contains fields from both Level.sav character entities and Players/*.sav account files

fields:
  # ===== From Level.sav character entities =====
  
  # Basic info
  NickName:
    description: "Player's in-game character name"
    root_key: "NickName"
    path: ["value"]
    default: "Unknown"
  
  Level:
    description: "Player's current level (1-55)"
    root_key: "Level"
    path: ["value"]
    default: 1
  
  Exp:
    description: "Total experience points accumulated by player"
    root_key: "Exp"
    path: ["value"]
    default: 0
  
  # HP - stored as FixedPoint64 (milli-HP / 1000)
  Hp:
    description: "Current player HP value, stored as milli-HP (divided by 1000)"
    root_key: "Hp"
    path: ["value", "Value", "value"]
    transform: divide_by_1000
    default: 100
  
  # MP/Stamina
  MP:
    description: "Current player stamina/MP value"
    root_key: "MP"
    path: ["value"]
    default: null
  
  # Condition
  FullStomach:
    description: "Player's current hunger/food level (0-100)"
    root_key: "FullStomach"
    path: ["value"]
    default: 100.0
  
  SanityValue:
    description: "Player's current sanity/mental health (0-100)"
    root_key: "SanityValue"
    path: ["value"]
    default: 100.0
  
  # ===== From Players/*.sav account files =====
  # Note: These paths assume data is already at SaveData.value level
  
  # Player identification
  PlayerUId:
    description: "Player's unique account ID"
    root_key: "PlayerUId"
    path: ["value"]
    default: null
  
  # Location/coordinates (from Players/*.sav LastTransform)
  LastTransform:
    description: "Player's last known position coordinates"
    root_key: "LastTransform"
    path: ["value", "Translation", "value"]
    default: null
  
  # Individual character instance ID (links to Level.sav)
  IndividualId:
    description: "Player character instance ID linking to Level.sav"
    root_key: "IndividualId"
    path: ["value", "InstanceId", "value"]
    default: null
  
  # Container IDs for pal storage
  OtomoCharacterContainerId:
    description: "Party/Otomo container ID"
    root_key: "OtomoCharacterContainerId"
    path: ["value", "ID", "value"]
    default: null
  
  PalStorageContainerId:
    description: "Palbox storage container ID"
    root_key: "PalStorageContainerId"
    path: ["value", "ID", "value"]
    default: null

  # ---- more from Players/*.sav (SaveData.value level) ----
  # The player's own item containers; each resolves in Level.sav's ItemContainerSaveData, the
  # same index that fills the chest view. Common = the bag, Essential = key items.
  CommonContainerId:
    description: "Bag"
    root_key: "InventoryInfo"
    path: ["value", "CommonContainerId", "value", "ID", "value"]
    default: null

  EssentialContainerId:
    description: "Key items"
    root_key: "InventoryInfo"
    path: ["value", "EssentialContainerId", "value", "ID", "value"]
    default: null

  WeaponLoadOutContainerId:
    description: "Weapon slots"
    root_key: "InventoryInfo"
    path: ["value", "WeaponLoadOutContainerId", "value", "ID", "value"]
    default: null

  PlayerEquipArmorContainerId:
    description: "Head, body, accessories, shield, glider"
    root_key: "InventoryInfo"
    path: ["value", "PlayerEquipArmorContainerId", "value", "ID", "value"]
    default: null

  FoodEquipContainerId:
    description: "Food slots"
    root_key: "InventoryInfo"
    path: ["value", "FoodEquipContainerId", "value", "ID", "value"]
    default: null

  TechnologyPoint:
    description: "Unspent technology points"
    root_key: "TechnologyPoint"
    path: ["value"]
    default: 0

  bossTechnologyPoint:
    description: "Unspent ancient technology points (absent on a player who has none)"
    root_key: "bossTechnologyPoint"
    path: ["value"]
    default: 0

  UnlockedRecipeTechnologyNames:
    description: "Every technology the player has unlocked, by id"
    root_key: "UnlockedRecipeTechnologyNames"
    path: ["value", "values"]
    default: []

  # Despite the name this is the last LOGIN: verified against the server log 2026-09-24 (Envy joined
  # 22:49:57Z, field 22:49:55Z; left 04:00Z, unchanged). UTC ticks.
  LastOnlineDateTime:
    description: ".NET ticks (100 ns since 0001-01-01 UTC) of the player's last login"
    root_key: "LastOnlineDateTime"
    path: ["value"]
    default: null

  # RecordData: the player's tallies. Maps are [{key, value}] lists; only their size or sum is used.
  TowerBossDefeatFlag:
    description: "Tower bosses beaten ({boss battle name: true})"
    root_key: "RecordData"
    path: ["value", "TowerBossDefeatFlag", "value"]
    default: []

  NormalBossDefeatFlag:
    description: "Alpha (field) bosses beaten"
    root_key: "RecordData"
    path: ["value", "NormalBossDefeatFlag", "value"]
    default: []

  PaldeckUnlockFlag:
    description: "Paldeck entries unlocked ({species: true})"
    root_key: "RecordData"
    path: ["value", "PaldeckUnlockFlag", "value"]
    default: []

  PalCaptureCount:
    description: "Pals caught per species ({species: n})"
    root_key: "RecordData"
    path: ["value", "PalCaptureCount", "value"]
    default: []

  FastTravelPointUnlockFlag:
    description: "Fast travel points unlocked ({point: true})"
    root_key: "RecordData"
    path: ["value", "FastTravelPointUnlockFlag", "value"]
    default: []

  NormalDungeonClearCount:
    description: "Dungeons cleared"
    root_key: "RecordData"
    path: ["value", "NormalDungeonClearCount", "value"]
    default: 0

  FixedDungeonClearCount:
    description: "Set dungeons cleared"
    root_key: "RecordData"
    path: ["value", "FixedDungeonClearCount", "value"]
    default: 0

# Lists
lists:
  GotStatusPointList:
    description: "Stat points allocated from leveling up"
    root_key: "GotStatusPointList"
    path: ["value", "values"]
    items:
      stat_name:
        description: "Name of stat being upgraded (e.g., HP, Attack, Defense)"
        path: ["StatusName", "value"]
      stat_points:
        description: "Number of points allocated to this stat"
        path: ["StatusPoint", "value"]
  
  GotExStatusPointList:
    description: "Additional stat points from Ancient Technology upgrades"
    root_key: "GotExStatusPointList"
    path: ["value", "values"]
    items:
      stat_name:
        description: "Name of stat from Ancient Tech (e.g., WorkSpeed, Weight)"
        path: ["StatusName", "value"]
      stat_points:
        description: "Number of Ancient Tech points in this stat"
        path: ["StatusPoint", "value"]
