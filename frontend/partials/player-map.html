{{!-- The "last seen" mini-map for the player modal: a crop of the tile pyramid around the last position,
     cut for a 640x800 box and centred, so it fills whatever the container gives it. Scope: selectedPlayer. --}}
                                    <template x-for="mm in [miniMap(selectedPlayer.location, 640, 800, 4)]" :key="'mm'">
                                        <div class="absolute inset-0">
                                            <button type="button" x-show="mm"
                                                    @click="closePlayerModal(); currentTab = 'map'; $nextTick(() => { const mapEl = document.querySelector('#worldMap'); if (mapEl) { const mc = Alpine.$data(mapEl.parentElement); if (mc && mc.centerOnLocation) mc.centerOnLocation(selectedPlayer.location.x, selectedPlayer.location.y); } })"
                                                    class="absolute inset-0 overflow-hidden rounded-lg border border-gray-700/60 bg-gray-900/70 hover:border-accent-500/60 transition-colors group/map"
                                                    :data-tip="`${Math.round(selectedPlayer.location.x)}, ${Math.round(selectedPlayer.location.y)} -- open the map here`">
                                                <span class="absolute left-1/2 top-1/2 w-[640px] h-[800px] -ml-[320px] -mt-[400px] pointer-events-none">
                                                    <template x-for="(t, i) in (mm ? mm.tiles : [])" :key="'t' + i">
                                                        <img :src="t.src" alt="" class="absolute max-w-none w-64 h-64 select-none brightness-[.7] saturate-[.8] group-hover/map:brightness-[.85] transition-[filter]" :style="`left:${t.left}px; top:${t.top}px`" loading="lazy">
                                                    </template>
                                                    <!-- the map tab's own player pin -->
                                                    <span class="absolute" :style="mm ? `left:${mm.pin.left}px; top:${mm.pin.top}px` : ''">
                                                        <span class="block w-6 h-6 -ml-3 -mt-3 bg-ok-500 rounded-full border-2 border-white shadow-lg flex items-center justify-center ring-4 ring-ok-500/25 group-hover/map:scale-110 transition-transform">
                                                            <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" /></svg>
                                                        </span>
                                                    </span>
                                                </span>
                                                <span class="absolute inset-0 pointer-events-none rounded-lg shadow-[inset_0_0_48px_rgba(0,0,0,.75)]"></span>
                                                <span class="absolute inset-x-0 bottom-0 h-14 bg-gradient-to-t from-gray-900/90 to-transparent pointer-events-none"></span>
                                                <span class="absolute bottom-2 left-2.5 right-2.5 flex items-center justify-between gap-2 text-[11px] pointer-events-none">
                                                    <span class="text-gray-100 font-medium truncate" x-text="selectedPlayer.place ? 'Near ' + selectedPlayer.place : (mm ? mm.label : '')"></span>
                                                    <span class="text-gray-400 whitespace-nowrap" x-show="selectedPlayer.last_online" x-text="formatRelativeTime(selectedPlayer.last_online, now)"></span>
                                                </span>
                                            </button>
                                            <div x-show="!mm" class="absolute inset-0 flex items-center justify-center text-3xl font-bold text-white/10 leading-none truncate px-2" x-text="selectedPlayer.player_name"></div>
                                        </div>
                                    </template>
