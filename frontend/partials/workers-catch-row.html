<!-- One wild species row inside the workforce modal (x-for scope: `c`). Click -> map with its spawn zones lit. -->
<div class="flex items-center gap-1">
<button @click="c.how && c.how !== 'wild' ? openSpecies(c.species_id) : workersCatchOnMap(c.species_id, c.species_name)"
        class="flex-1 min-w-0 flex items-center gap-2.5 rounded-lg px-2 py-1.5 hover:bg-gray-700/50 transition-colors text-left group"
        :data-tip="c.how && c.how !== 'wild' ? 'How do you get ' + c.species_name + '?' : 'Where does ' + c.species_name + ' spawn?'">
    <div class="relative flex-shrink-0">
        <img :src="palIconSrc(c)" @error="palIconError($el, c)" loading="lazy" alt=""
             class="w-9 h-9 rounded-lg bg-gray-900 object-cover group-hover:ring-2 group-hover:ring-accent-400">
        <span class="absolute -bottom-1 -right-1 text-[10px] font-bold text-white rounded-full w-4 h-4 flex items-center justify-center border border-gray-900"
              :style="`background:${workLevelColor(c.work_level)}`" x-text="c.work_level"></span>
    </div>
    <div class="min-w-0 flex-1">
        <div class="text-sm font-medium text-gray-100 truncate flex items-center gap-1.5">
            <span x-text="c.species_name"></span>
            <!-- the pin means "click for its spawn zones"; event and boss catches open the Paldeck entry instead -->
            <svg x-show="!c.how || c.how === 'wild'" class="w-3.5 h-3.5 text-accent-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <span x-show="workers && c.work_level > workers.best_owned_level" class="px-1.5 py-px rounded text-[10px] font-medium bg-ok-500/20 text-ok-200 border border-ok-500/40 whitespace-nowrap">better than owned</span>
            <span x-show="workers && workers.best_owned_level && c.work_level === workers.best_owned_level" class="px-1.5 py-px rounded text-[10px] font-medium bg-gray-700/60 text-gray-300 border border-gray-600/60 whitespace-nowrap">as good</span>
        </div>
        <div class="text-[11px] text-gray-400 truncate">
            <span x-text="catchHowLabel(c.how)"></span> <span class="tabular-nums text-gray-300">Lv <span x-text="c.spawn_level"></span></span>
            <span x-show="c.owned" class="text-gray-500"> · <span x-text="c.owned"></span> owned</span>
        </div>
    </div>
</button>
    <button @click="openSpecies(c.species_id)" class="btn-quiet p-1.5 flex-shrink-0 text-gray-500 hover:text-accent-200"
            :data-tip="c.species_name + ' in the Paldeck'" :aria-label="c.species_name + ' in the Paldeck'">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
    </button>
</div>
