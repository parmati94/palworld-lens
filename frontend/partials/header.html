<body class="bg-gray-900 text-gray-100 min-h-screen" x-data="app" x-cloak>

    <script>
        (async function() {
            try {
                const res = await fetch('/api/auth/status', { credentials: 'same-origin' });
                const data = await res.json();
                if (data.enabled && !data.authenticated) {
                    console.log('🔒 Not authenticated, redirecting to login...');
                    window.location.replace('/login.html');
                }
            } catch (err) {
                console.error('Auth check error:', err);
            }
        })();
    </script>

    <!-- Header: one compact bar. World name + last-updated sit under the title;
         controls on the right. No secondary details row. -->
    <header class="sticky top-0 z-50 bg-gray-800/90 backdrop-blur-sm border-b border-gray-700/60 shadow-lg">
        <div class="container mx-auto px-4 py-2">
            <div class="flex items-center justify-between gap-3">
                <!-- Logo, title, save context -->
                <div class="flex items-center gap-2.5 min-w-0">
                    <a href="#overview" @click.prevent="currentTab = 'overview'" class="h-9 w-9 flex items-center justify-center bg-blue-500/15 rounded-lg border border-blue-400/30 flex-shrink-0 p-1">
                        <img src="/img/favicon/apple-touch-icon.png?v=2" alt="Palworld Lens Logo" class="w-full h-full object-contain rounded-md">
                    </a>
                    <div class="min-w-0 leading-tight">
                        <h1 class="text-lg font-bold text-blue-200 tracking-wide cursor-pointer truncate" @click="currentTab = 'overview'">Palworld Lens</h1>
                        <div x-show="saveInfo.loaded" class="flex items-center gap-1.5 text-xs text-gray-400 truncate">
                            <span class="text-gray-200 font-medium truncate" x-text="saveInfo.world_name"></span>
                            <span x-show="saveInfo.last_updated" class="text-gray-600 hidden sm:inline">·</span>
                            <span x-show="saveInfo.last_updated" class="truncate hidden sm:inline" :title="formatDate(saveInfo.last_updated)">
                                Updated <span x-text="formatRelativeTime(saveInfo.last_updated, now)"></span>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
                    <!-- Auto-Watch / Polling toggle. Click the label to explain a disabled state (works on touch). -->
                    <div class="relative" x-data="{ showTooltip: false }" @click.outside="showTooltip = false">
                        <div class="flex items-center gap-2 px-2 sm:px-2.5 py-1.5 rounded-lg border transition-colors"
                             :class="autoWatchActive ? 'bg-green-500/10 border-green-500/30' : 'bg-gray-700/40 border-gray-600/30'">
                            <button type="button"
                                    class="flex items-center gap-1.5 text-sm font-medium"
                                    :class="autoWatchActive ? 'text-green-300' : 'text-gray-300'"
                                    :title="autoWatchAllowed ? (remoteMode ? 'Poll the remote server for save changes' : 'Watch the save folder for changes') : 'Why is this disabled?'"
                                    @click="showTooltip = !showTooltip">
                                <svg class="w-4 h-4" :class="autoWatchActive ? 'text-green-400' : 'text-gray-400'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                <span class="hidden sm:inline" x-text="remoteMode ? 'Polling' : 'Auto-Watch'"></span>
                                <span x-show="autoWatchActive" class="w-1.5 h-1.5 bg-green-400 rounded-full pulse-active"></span>
                            </button>
                            <button type="button"
                                    role="switch"
                                    :aria-checked="autoWatchActive"
                                    :aria-label="remoteMode ? 'Toggle polling' : 'Toggle auto-watch'"
                                    @click="autoWatchAllowed ? toggleAutoWatch() : (showTooltip = !showTooltip)"
                                    :disabled="watchToggling"
                                    :class="{
                                        'bg-green-500': autoWatchActive,
                                        'bg-gray-600': !autoWatchActive && autoWatchAllowed,
                                        'bg-gray-700 cursor-not-allowed': !autoWatchAllowed,
                                        'opacity-50': watchToggling
                                    }"
                                    class="relative inline-flex h-5 w-9 items-center rounded-full transition-colors shadow-inner">
                                <span :class="autoWatchActive ? 'translate-x-5' : 'translate-x-0.5'"
                                      class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform shadow-sm"></span>
                            </button>
                        </div>

                        <!-- Explanation popover -->
                        <div x-show="showTooltip"
                             x-transition.opacity.duration.150ms
                             class="absolute top-full mt-2 right-0 w-72 bg-gray-800 border rounded-lg p-3 shadow-xl z-50 text-xs"
                             :class="autoWatchAllowed ? 'border-gray-600 text-gray-300' : 'border-yellow-500/60 text-yellow-100'"
                             style="display: none;">
                            <template x-if="!autoWatchAllowed && !remoteMode">
                                <div>
                                    <div class="font-semibold mb-1">Auto-Watch is disabled</div>
                                    <div class="text-gray-300">Set <code class="bg-gray-700 px-1 rounded">ENABLE_AUTO_WATCH=true</code> in your environment to watch the save folder for changes.</div>
                                </div>
                            </template>
                            <template x-if="!autoWatchAllowed && remoteMode">
                                <div>
                                    <div class="font-semibold mb-1">Polling is disabled</div>
                                    <div class="text-gray-300">Set <code class="bg-gray-700 px-1 rounded">REMOTE_POLL_INTERVAL</code> to a value greater than 0 to poll the remote server. It is currently 0 (manual reload only).</div>
                                </div>
                            </template>
                            <template x-if="autoWatchAllowed && !remoteMode">
                                <div>
                                    <div class="font-semibold mb-1 text-gray-100">Auto-Watch</div>
                                    <div>When on, the save folder is watched and the page updates itself whenever the game writes a new save.</div>
                                </div>
                            </template>
                            <template x-if="autoWatchAllowed && remoteMode">
                                <div>
                                    <div class="font-semibold mb-1 text-gray-100">Remote polling</div>
                                    <div class="space-y-1">
                                        <div>Connection: <span class="text-blue-300 font-mono" x-text="remoteUser + '@' + remoteHost"></span></div>
                                        <div>Protocol: <span class="text-blue-300 uppercase" x-text="remoteProtocol"></span></div>
                                        <div>Poll interval: <span class="text-blue-300" x-text="remotePollInterval + 's'"></span></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Reload -->
                    <button
                        @click="reloadSave()"
                        :disabled="loading"
                        title="Re-read the save files now"
                        class="px-2.5 sm:px-3 py-1.5 bg-green-600/90 hover:bg-green-600 disabled:bg-gray-600 disabled:cursor-not-allowed rounded-lg text-sm font-medium transition-colors flex items-center gap-1.5">
                        <svg x-show="!loading" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        <svg x-show="loading" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span class="hidden sm:inline" x-text="loading ? 'Reloading…' : 'Reload'"></span>
                    </button>

                    <!-- Server Info (RCON) -->
                    <button
                        @click="$dispatch('show-server-info')"
                        title="Live server status via RCON"
                        aria-label="Server info"
                        class="px-2 sm:px-2.5 py-1.5 hover:bg-blue-500/20 rounded-lg transition-colors flex items-center gap-1.5 text-sm text-blue-300 hover:text-blue-200 border border-transparent hover:border-blue-500/30">
                        <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
                        </svg>
                        <span class="hidden md:inline">Server</span>
                    </button>

                    <!-- Logout (only when auth is enabled) -->
                    <button
                        @click="async () => { await fetch('/api/auth/logout', {method: 'POST', credentials: 'same-origin'}); window.location.href = '/login.html'; }"
                        x-init="fetch('/api/auth/status', {credentials: 'same-origin'}).then(r => r.json()).then(d => $el.style.display = d.enabled ? 'flex' : 'none').catch(() => {})"
                        style="display: none;"
                        title="Log out"
                        aria-label="Log out"
                        class="p-1.5 hover:bg-gray-700/50 rounded-lg transition-colors group">
                        <svg class="w-5 h-5 text-gray-400 group-hover:text-red-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-4 sm:py-6">

        <!-- Loading State -->
        <div x-show="!saveInfo.loaded && !error" class="py-8">
            <div class="animate-pulse space-y-6">
                <!-- Skeleton cards -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-gray-800 rounded-lg p-6 border border-gray-700 h-20"></div>
                    <div class="bg-gray-800 rounded-lg p-6 border border-gray-700 h-20"></div>
                    <div class="bg-gray-800 rounded-lg p-6 border border-gray-700 h-20"></div>
                    <div class="bg-gray-800 rounded-lg p-6 border border-gray-700 h-20"></div>
                </div>
                <div class="flex items-center justify-center py-8">
                    <svg class="animate-spin h-8 w-8 text-blue-400 mr-3" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="text-gray-400">Loading save data...</p>
                </div>
            </div>
        </div>

        <!-- Error State -->
        <div x-show="error" class="bg-red-900/20 border border-red-500 rounded-lg p-6 mb-6">
            <div class="flex items-start gap-3">
                <svg class="w-6 h-6 text-red-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <div>
                    <h3 class="text-red-400 font-bold mb-1">Error Loading Save</h3>
                    <p class="text-gray-300" x-text="error"></p>
                </div>
            </div>
        </div>
