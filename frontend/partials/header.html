<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col" x-data="app" x-cloak>
    <!-- Textured ground behind everything (css/styles.css .page-backdrop) -->
    <div class="page-backdrop" aria-hidden="true"></div>

    <script>
        (async function() {
            try {
                const res = await fetch('/api/auth/status', { credentials: 'same-origin' });
                const data = await res.json();
                if (data.enabled && !data.authenticated) {
                    console.log('🔒 Not authenticated, redirecting to login...');
                    window.location.replace('/login.html');
                }
            } catch (err) {
                console.error('Auth check error:', err);
            }
        })();
    </script>

    <!-- Header: one 56px bar. Wordmark, then the section tabs (md+), controls on
         the right. On phones the tabs move to the bottom bar (tab-navigation.html). -->
    <header class="sticky top-0 z-50 bg-gray-900/85 backdrop-blur-md border-b border-gray-800">
        <!-- Full width up to the largest container size: `container` alone caps the bar
             at 768px on tablets and landscape phones, which starved the tabs. -->
        <div class="w-full max-w-screen-2xl mx-auto px-4 h-14 flex items-stretch justify-between gap-3">
            <!-- Left: wordmark + tabs -->
            <div class="flex items-stretch gap-1 min-w-0 flex-1">
                <div class="flex items-center gap-2.5 group min-w-0 shrink-0 -ml-1 px-1">
                    <a href="#overview" @click.prevent="currentTab = 'overview'" data-tip="Overview"
                       class="h-8 w-8 flex items-center justify-center bg-gray-800 rounded-lg border border-accent-500/40 group-hover:border-accent-500/70 transition-colors flex-shrink-0 p-1">
                        <img src="/img/favicon/apple-touch-icon.png?v=2" alt="Palworld Lens logo" class="w-full h-full object-contain rounded-md">
                    </a>
                    <div class="min-w-0 leading-none">
                        <a href="#overview" @click.prevent="currentTab = 'overview'" data-tip="Overview" class="block">
                            <h1 class="text-lg font-display font-bold tracking-tight leading-none whitespace-nowrap">
                                <span class="text-gray-200 group-hover:text-white transition-colors">Palworld</span><span class="bg-gradient-to-r from-accent-300 to-accent-500 bg-clip-text text-transparent drop-shadow-[0_0_8px_rgb(var(--accent-500)_/_0.35)] group-hover:drop-shadow-[0_0_17px_rgb(var(--accent-400)_/_0.8)] transition-all duration-300"> Lens</span>
                            </h1>
                        </a>
                        <!-- World + freshness + watcher state, under the wordmark where there is
                             room (phones, lg+). The dot pulses while the save is being watched or
                             polled; "manual" appears when it is not. Tap opens Settings. -->
                        <button x-show="saveInfo.loaded" @click="showSettings = true" type="button"
                                :data-tip="autoWatchActive ? (remoteMode ? 'Polling the remote server for save changes' : 'Watching the save folder for changes') : 'Not watching for changes. Reload by hand, or turn Auto-Watch on in Settings.'"
                                class="md:hidden lg:flex flex items-center gap-1.5 text-[11px] leading-4 text-gray-500 mt-0.5 min-w-0 max-w-full hover:text-gray-300 transition-colors">
                            <span class="w-1.5 h-1.5 rounded-full flex-shrink-0" :class="autoWatchActive ? 'bg-ok-400 pulse-active' : 'bg-gray-600'"></span>
                            <span class="text-gray-400 font-medium truncate" x-text="saveInfo.world_name"></span>
                            <span x-show="saveInfo.last_updated" class="text-gray-700">·</span>
                            <span x-show="saveInfo.last_updated" class="truncate whitespace-nowrap" :data-tip="formatDate(saveInfo.last_updated)">
                                Updated <span x-text="formatRelativeTime(saveInfo.last_updated, now)"></span>
                            </span>
                            <span x-show="!autoWatchActive" class="text-gray-600 whitespace-nowrap flex-shrink-0">· manual</span>
                        </button>
                    </div>
                </div>

                <div class="hidden md:block w-px self-center h-6 bg-gray-800 mx-2 shrink-0"></div>

                <!-- Section tabs (md+): underline style. Tools sit after a divider with an icon. -->
                <!-- Between md and lg (tablets, phones on their side) the tabs tighten and the
                     nav scrolls sideways instead of running into the controls. -->
                <nav x-show="saveInfo.loaded" class="hidden md:flex items-stretch gap-0.5 min-w-0 overflow-x-auto scrollbar-hide" aria-label="Sections">
                    <template x-for="tab in tabs.filter(t => !t.tool)" :key="tab.id">
                        <a :href="'#' + tab.id"
                           @click.prevent="currentTab = tab.id"
                           :class="currentTab === tab.id ? 'border-accent-400 text-accent-400' : 'border-transparent text-gray-400 hover:text-gray-200'"
                           :aria-current="currentTab === tab.id ? 'page' : null"
                           class="flex items-center gap-1.5 px-1.5 lg:px-3 text-[13px] lg:text-sm font-medium border-b-2 -mb-px transition-colors whitespace-nowrap shrink-0">
                            <span x-text="tab.label"></span>
                            <span x-show="tab.count !== null" class="hidden lg:inline text-[11px] tabular-nums"
                                  :class="currentTab === tab.id ? 'text-accent-400/70' : 'text-gray-600'" x-text="tab.count"></span>
                        </a>
                    </template>
                    <div class="w-px self-center h-6 bg-gray-800 mx-1.5 shrink-0" aria-hidden="true"></div>
                    <template x-for="tab in tabs.filter(t => t.tool)" :key="tab.id">
                        <a :href="'#' + tab.id"
                           @click.prevent="currentTab = tab.id"
                           :class="currentTab === tab.id ? 'border-accent-400 text-accent-400' : 'border-transparent text-gray-400 hover:text-gray-200'"
                           :aria-current="currentTab === tab.id ? 'page' : null"
                           :data-tip="tab.title"
                           class="flex items-center gap-1.5 px-1.5 lg:px-3 text-[13px] lg:text-sm font-medium border-b-2 -mb-px transition-colors whitespace-nowrap shrink-0">
                            <svg class="w-3.5 h-3.5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" :d="tab.icon" /></svg>
                            <span x-text="tab.label"></span>
                        </a>
                    </template>
                </nav>
            </div>

            <!-- Right: watch state, reload, server, logout -->
            <div class="flex items-center gap-0.5 sm:gap-1.5 flex-shrink-0">
                <!-- Reload: an occasional action, so it is quiet. Auto-Watch above is the primary state. -->
                <button
                    @click="reloadSave()"
                    :disabled="loading"
                    data-tip="Re-read the save files now"
                    aria-label="Reload save"
                    class="btn-quiet p-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-5 h-5" :class="loading ? 'animate-spin text-accent-400' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>

                <!-- Server Info (RCON) -->
                <button
                    @click="$dispatch('show-server-info')"
                    data-tip="Live server status via RCON"
                    aria-label="Server info"
                    class="btn-quiet p-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12V7a2 2 0 012-2h10a2 2 0 012 2v5M5 12h14M5 12a2 2 0 00-2 2v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 00-2-2M8 16h.01M12 16h.01M8 8h.01M12 8h.01" />
                    </svg>
                </button>

                <!-- Settings: watcher, accent colour, motion -->
                <button @click="showSettings = true" data-tip="Settings" aria-label="Settings" class="btn-quiet p-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>

                <!-- Logout (only when auth is enabled) -->
                <button
                    @click="async () => { await fetch('/api/auth/logout', {method: 'POST', credentials: 'same-origin'}); window.location.href = '/login.html'; }"
                    x-init="fetch('/api/auth/status', {credentials: 'same-origin'}).then(r => r.json()).then(d => $el.style.display = d.enabled ? 'inline-flex' : 'none').catch(() => {})"
                    style="display: none;"
                    data-tip="Log out"
                    aria-label="Log out"
                    class="btn-quiet p-2 group hover:text-danger-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content. Bottom padding clears the phone tab bar. -->
    <main class="container mx-auto px-4 py-4 sm:py-6 pb-24 md:pb-6 flex-1 w-full">

        <!-- Loading State -->
        <div x-show="!saveInfo.loaded && !error" class="py-8">
            <div class="animate-pulse space-y-6">
                <!-- Skeleton cards -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="card h-20"></div>
                    <div class="card h-20"></div>
                    <div class="card h-20"></div>
                    <div class="card h-20"></div>
                </div>
                <div class="flex items-center justify-center py-8">
                    <svg class="animate-spin h-8 w-8 text-accent-400 mr-3" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="text-gray-400">Loading save data...</p>
                </div>
            </div>
        </div>

        <!-- Error State -->
        <div x-show="error" class="bg-danger-900/30 border border-danger-700 rounded-xl p-6 mb-6">
            <div class="flex items-start gap-3">
                <svg class="w-6 h-6 text-danger-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <div>
                    <h3 class="text-danger-300 font-semibold mb-1">Error Loading Save</h3>
                    <p class="text-gray-300" x-text="error"></p>
                </div>
            </div>
        </div>
