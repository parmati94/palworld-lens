<!-- Workforce modal: "Best <work> on the server". Data: /api/workers via loadWorkers().
     Opened from the Pals tab's "Best workers" pill. Server-wide on purpose -- who already
     has the best, and what could be caught. The only per-reader input is "up to level N":
     every species' lowest field spawn level is compared against a level the reader picks,
     with each player's level offered as a preset, so nobody has to say who they are. -->
<div x-show="workersOpen" x-cloak
     @keydown.escape.window="closeWorkers()"
     class="fixed inset-0 z-[60] flex items-center justify-center p-3 sm:p-6 bg-black/75 backdrop-blur-sm">
    <div @click.away="closeWorkers()"
         class="bg-gray-800 rounded-xl shadow-2xl w-full max-w-4xl max-h-[92vh] flex flex-col border border-gray-700/60 overflow-hidden">

        <!-- Header -->
        <div class="px-4 sm:px-5 py-3 border-b border-gray-700/60 flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-accent-500/15 border border-accent-500/30 flex items-center justify-center flex-shrink-0">
                <svg class="w-5 h-5 text-accent-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" /></svg>
            </div>
            <div class="min-w-0 flex-1">
                <div class="text-base font-semibold text-gray-100">Best workers</div>
                <div class="text-xs text-gray-400 truncate">Who already has the best pal for a job on this server, and what you could catch</div>
            </div>
            <button @click="closeWorkers()" class="btn-quiet p-1.5" aria-label="Close">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
        </div>

        <!-- Job picker row -->
        <div class="px-4 sm:px-5 py-2.5 border-b border-gray-700/60 bg-gray-900/40 flex flex-wrap items-center gap-x-4 gap-y-2">
            <div class="flex items-center gap-2.5 min-w-0">
                <span class="eyebrow">Job</span>
                <img :src="workTypeIcon(workersType)" alt="" class="w-6 h-6 flex-shrink-0" onerror="this.onerror=null; this.src='/img/unknown.webp'">
                <div class="w-44" x-data="selectMenu({ options: () => workersTypeList().map(t => ({ value: t.id, label: t.name })), required: true })"
                     x-modelable="value" x-model="workersType">
                    {{> select-menu }}
                </div>
            </div>
            <div class="text-xs text-gray-400 ml-auto">
                <span x-show="workersLoading">Looking…</span>
                <template x-if="!workersLoading && workers && workers.work_type === workersType">
                    <span>Job levels go up to <span class="tabular-nums text-gray-300" x-text="workers.max_level"></span><span x-show="workers.best_owned_level"> · the server's best is <span class="tabular-nums text-gray-300" x-text="workers.best_owned_level"></span></span></span>
                </template>
            </div>
        </div>

        <!-- Body -->
        <div class="overflow-y-auto p-4 sm:p-5">
            <template x-if="workers && workers.work_type === workersType">
                <div class="space-y-5">
                    <!-- Already on the server: compact row of the best -->
                    <section>
                        <div class="eyebrow mb-2">Already here</div>
                        <div x-show="workers.owned.length === 0" class="text-sm text-gray-500">Nobody owns a pal that can do this yet.</div>
                        <div class="flex flex-wrap gap-2">
                            <template x-for="o in workers.owned" :key="o.instance_id">
                                <button @click="workersOpenPal(o.instance_id)"
                                        class="flex items-center gap-2 rounded-lg border border-gray-700/60 bg-gray-900/40 pl-1.5 pr-3 py-1.5 hover:border-gray-600 transition-colors text-left group"
                                        :data-tip="'Open ' + o.name">
                                    <div class="relative flex-shrink-0">
                                        <img :src="palIconSrc(o)" @error="palIconError($el, o)" loading="lazy" alt=""
                                             class="w-9 h-9 rounded-lg bg-gray-900 object-cover group-hover:ring-2 group-hover:ring-accent-400">
                                        <span class="absolute -bottom-1 -right-1 text-[10px] font-bold text-white rounded-full w-4 h-4 flex items-center justify-center border border-gray-900"
                                              :style="`background:${workLevelColor(o.work_level)}`" x-text="o.work_level"></span>
                                    </div>
                                    <div class="min-w-0">
                                        <div class="text-sm font-medium text-gray-100 truncate">
                                            <span x-text="o.name"></span>
                                            <span x-show="o.count > 1" class="text-gray-500 font-normal tabular-nums" x-text="'×' + o.count"></span>
                                        </div>
                                        <div class="text-[11px] text-gray-400 truncate">
                                            Lv <span class="tabular-nums text-gray-300" x-text="o.level"></span><span x-show="o.owner"> · <span class="text-gray-300" x-text="o.owner"></span></span><span x-show="o.base_name" x-text="' · ' + o.base_name"></span>
                                        </div>
                                    </div>
                                </button>
                            </template>
                        </div>
                    </section>

                    <!-- Catchable up to a level the reader picks -->
                    <section>
                        <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mb-3">
                            <div class="eyebrow">Catchable</div>
                            <label class="flex items-center gap-2 text-sm text-gray-300">
                                <span>up to level</span>
                                <input type="number" min="1" max="100" x-model.number="workersMaxLevel"
                                       class="w-16 bg-gray-900/70 border border-gray-700/60 rounded-md px-2 py-1 text-sm font-semibold text-gray-100 tabular-nums text-center focus:outline-none focus:ring-2 focus:ring-accent-500/50">
                            </label>
                            <input type="range" min="1" max="100" x-model.number="workersMaxLevel" aria-label="Up to level"
                                   class="flex-1 min-w-[8rem] accent-accent-500">
                            <!-- Player presets: tap your own name -->
                            <div class="flex items-center gap-1 flex-wrap">
                                <template x-for="p in workersPlayers()" :key="p.name">
                                    <button @click="workersMaxLevel = p.level"
                                            class="px-2 py-0.5 rounded-full text-xs border transition-colors tabular-nums"
                                            :class="workersMaxLevel === p.level ? 'bg-accent-500/20 border-accent-500/50 text-accent-100' : 'border-gray-700/60 text-gray-400 hover:text-gray-200 hover:border-gray-600'"
                                            :data-tip="p.name + ' is level ' + p.level">
                                        <span x-text="p.name"></span> <span x-text="p.level"></span>
                                    </button>
                                </template>
                            </div>
                        </div>

                        <div x-show="workersCatchList().length === 0" class="text-sm text-gray-500">
                            Nothing that does this job spawns at level <span class="tabular-nums" x-text="workersMaxLevel"></span> or under.
                        </div>
                        <div class="grid gap-1 sm:grid-cols-2">
                            <template x-for="c in workersCatchList()" :key="c.species_id">
                                {{> workers-catch-row }}
                            </template>
                        </div>

                        <!-- What a higher level would unlock -->
                        <template x-if="workersNextUp()">
                            <div class="mt-3 text-xs text-gray-500">
                                Next up: <span class="text-gray-300" x-text="workersNextUp().species_name"></span>
                                (job level <span class="tabular-nums text-gray-300" x-text="workersNextUp().work_level"></span>)
                                from level <span class="tabular-nums text-gray-300" x-text="workersNextUp().spawn_level"></span>.
                                <button @click="workersMaxLevel = workersNextUp().spawn_level" class="btn-quiet px-2 py-0.5 border border-gray-700/60 text-gray-300 ml-1">Go to <span class="tabular-nums" x-text="workersNextUp().spawn_level"></span></button>
                            </div>
                        </template>
                    </section>
                </div>
            </template>
            <div x-show="!workers && !workersLoading" class="text-sm text-gray-500">Couldn't load this work type.</div>
        </div>
    </div>
</div>
