        <!-- Players Tab: one card per player. Stats are a strip inside the card,
             not tiles inside the card, so the hierarchy stays two levels deep. -->
        <div x-show="currentTab === 'players' && saveInfo.loaded" class="tab-content">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
                <template x-for="player in players" :key="player.uid">
                    <div class="card p-5 hover:border-gray-600 transition-colors">

                        <!-- Who -->
                        <div class="flex items-start justify-between gap-3 mb-4">
                            <div class="min-w-0">
                                <h3 class="text-lg font-semibold text-white truncate leading-tight" x-text="player.player_name"></h3>
                                <div class="text-xs text-gray-400 mt-1 flex items-center gap-1.5 flex-wrap">
                                    <span>Level <span class="text-gray-200 font-medium tabular-nums" x-text="player.level"></span></span>
                                    <span x-show="player.last_online" class="text-gray-600">·</span>
                                    <span x-show="player.last_online" :data-tip="formatDate(player.last_online)">seen <span x-text="formatRelativeTime(player.last_online, now)"></span></span>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 flex-shrink-0">
                                <span class="text-[11px] font-mono text-gray-500" :data-tip="'UID ' + player.uid" x-text="player.uid.substring(0, 8)"></span>
                                <button
                                    x-show="player.location && player.location.x !== undefined"
                                    @click="currentTab = 'map'; $nextTick(() => { const mapEl = document.querySelector('#worldMap'); if (mapEl) { const mapComponent = Alpine.$data(mapEl.parentElement); if (mapComponent && mapComponent.centerOnLocation) mapComponent.centerOnLocation(player.location.x, player.location.y); } });"
                                    data-tip="Show on map"
                                    aria-label="Show on map"
                                    class="btn-quiet w-8 h-8 justify-center border border-gray-700/60 hover:border-accent-500/50 hover:text-accent-300">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Needs: label, value and a bar whose colour tracks the value -->
                        <div class="grid grid-cols-2 gap-x-5 gap-y-3.5 pt-4 border-t border-gray-700/60">
                            <div>
                                <div class="flex items-center justify-between gap-2 text-xs mb-1.5">
                                    <span class="flex items-center gap-1.5 text-gray-400"><img src="/img/health.webp" alt="" class="w-3.5 h-3.5 opacity-80"> Health</span>
                                    <span class="font-semibold tabular-nums" :class="needTextClass((player.hp / player.max_hp) * 100)" x-text="`${player.hp}/${player.max_hp}`"></span>
                                </div>
                                <div class="w-full bg-gray-700 rounded-full h-1.5">
                                    <div class="h-1.5 rounded-full" :class="needBarClass((player.hp / player.max_hp) * 100)" :style="`width: ${(player.hp / player.max_hp) * 100}%`"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex items-center justify-between gap-2 text-xs mb-1.5">
                                    <span class="flex items-center gap-1.5 text-gray-400"><img src="/img/food.webp" alt="" class="w-3.5 h-3.5 opacity-80"> Hunger</span>
                                    <span class="font-semibold tabular-nums" :class="needTextClass(player.hunger)" x-text="`${Math.round(player.hunger)}%`"></span>
                                </div>
                                <div class="w-full bg-gray-700 rounded-full h-1.5">
                                    <div class="h-1.5 rounded-full" :class="needBarClass(player.hunger)" :style="`width: ${player.hunger}%`"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex items-center justify-between gap-2 text-xs mb-1.5">
                                    <span class="flex items-center gap-1.5 text-gray-400"><img src="/img/heart.webp" alt="" class="w-3.5 h-3.5 opacity-80"> Sanity</span>
                                    <span class="font-semibold tabular-nums" :class="needTextClass(player.sanity)" x-text="`${Math.round(player.sanity)}%`"></span>
                                </div>
                                <div class="w-full bg-gray-700 rounded-full h-1.5">
                                    <div class="h-1.5 rounded-full" :class="needBarClass(player.sanity)" :style="`width: ${player.sanity}%`"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex items-center justify-between gap-2 text-xs mb-1.5">
                                    <span class="flex items-center gap-1.5 text-gray-400">
                                        <svg class="w-3.5 h-3.5 opacity-80" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>
                                        Experience
                                    </span>
                                    <span class="font-semibold tabular-nums text-purple-400" x-text="player.exp.toLocaleString()"></span>
                                </div>
                            </div>
                        </div>

                        <!-- Guild + link to this player's pals -->
                        <div class="mt-4 pt-3 border-t border-gray-700/60 flex items-center justify-between gap-3">
                            <div class="min-w-0 text-xs text-gray-400">
                                Guild <span class="text-cyan-400 font-medium truncate" x-text="getGuildName(player.guild_id)"></span>
                            </div>
                            <button
                                @click="viewPalsOf(player.player_name)"
                                class="btn-quiet flex-shrink-0 px-2.5 py-1.5 text-xs font-medium border border-gray-700/60 text-gray-300 hover:border-gray-600">
                                <img src="/img/capture.webp" alt="" class="w-3.5 h-3.5 opacity-80">
                                View pals
                                <span class="tabular-nums text-gray-500" x-text="pals.filter(p => p.owner_uid === player.player_name).length"></span>
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
