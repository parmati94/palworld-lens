        <!-- Players Tab: one card per player, kept to who they are and who rides with them;
             the inventory, party and status live in the player modal (modals.html). -->
        <div x-show="currentTab === 'players' && saveInfo.loaded" class="tab-content">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
                <template x-for="player in players" :key="player.uid">
                    <!-- The whole card opens the player modal; the map, party and Pals buttons stop the click. -->
                    <div class="card p-5 group cursor-pointer hover:border-accent-500/50 hover:shadow-lg hover:shadow-accent-500/5 transition-all"
                         role="button" tabindex="0"
                         @click="$dispatch('open-player-modal', { player })"
                         @keydown.enter.prevent="$dispatch('open-player-modal', { player })"
                         @keydown.space.prevent="$dispatch('open-player-modal', { player })">

                        <!-- Who -->
                        <div class="flex items-start justify-between gap-3 mb-4">
                            <div class="min-w-0">
                                <h3 class="text-lg font-semibold text-white truncate leading-tight group-hover:text-accent-200 transition-colors" x-text="player.player_name"></h3>
                                <div class="text-xs text-gray-400 mt-1 flex items-center gap-1.5 flex-wrap">
                                    <span>Level <span class="text-gray-200 font-medium tabular-nums" x-text="player.level"></span></span>
                                    {{> player-presence who="player" }}
                                </div>
                            </div>
                            <div class="flex items-center gap-2 flex-shrink-0">
                                <span class="text-[11px] font-mono text-gray-500" :data-tip="'UID ' + player.uid" x-text="player.uid.substring(0, 8)"></span>
                                <button
                                    x-show="player.location && player.location.x !== undefined"
                                    @click.stop="currentTab = 'map'; $nextTick(() => { const mapEl = document.querySelector('#worldMap'); if (mapEl) { const mapComponent = Alpine.$data(mapEl.parentElement); if (mapComponent && mapComponent.centerOnLocation) mapComponent.centerOnLocation(player.location.x, player.location.y); } });"
                                    data-tip="Show on map"
                                    aria-label="Show on map"
                                    class="btn-quiet w-8 h-8 justify-center border border-gray-700/60 hover:border-accent-500/50 hover:text-accent-300">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Party: who rides along, in slot order. Everything else lives in the modal. -->
                        <div class="pt-4 border-t border-gray-700/60 flex items-center gap-1.5 flex-wrap">
                            <template x-for="pal in player.party" :key="pal.instance_id">
                                <button type="button" @click.stop="openPalById(pal.instance_id)"
                                        class="flex items-center gap-1 pr-2 rounded-full bg-gray-900/60 border border-gray-700/60 hover:border-accent-500/60 transition-colors min-w-0"
                                        :data-tip="pal.name + ' · Lv ' + pal.level + ' -- open'">
                                    <img :src="palIconSrc(pal)" :alt="pal.name" class="w-7 h-7 rounded-full flex-shrink-0" @error="palIconError($el, pal)">
                                    <span class="text-xs text-gray-300 truncate max-w-[5.5rem]" x-text="pal.name"></span>
                                </button>
                            </template>
                            <span x-show="!player.party.length" class="text-xs text-gray-500">Nobody in the party</span>
                        </div>

                        <!-- Guild, the player's pals, and the way into the modal -->
                        <div class="mt-4 pt-3 border-t border-gray-700/60 flex items-center justify-between gap-3">
                            <div class="min-w-0 text-xs text-gray-400">
                                Guild <span class="text-cyan-400 font-medium truncate" x-text="getGuildName(player.guild_id)"></span>
                            </div>
                            <div class="flex items-center gap-2 flex-shrink-0">
                                <button
                                    @click.stop="viewPalsOf(player.player_name)"
                                    class="btn-quiet px-2.5 py-1.5 text-xs font-medium border border-gray-700/60 text-gray-300 hover:border-gray-600">
                                    <img src="/img/capture.webp" alt="" class="w-3.5 h-3.5 opacity-80">
                                    Pals
                                    <span class="tabular-nums text-gray-500" x-text="pals.filter(p => p.owner_uid === player.player_name).length"></span>
                                </button>
                                <svg class="w-4 h-4 text-gray-600 group-hover:text-accent-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
