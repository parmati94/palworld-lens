        <!-- Breeding Tab: what two pals make, or how to make one -- checked against the pals you own. -->
        <div x-show="currentTab === 'breeding' && saveInfo.loaded" class="tab-content">
            <!-- Controls -->
            <div class="mb-4 bg-gray-800/40 border border-gray-700/50 rounded-xl p-4">
                <div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-4">
                    <div class="inline-flex rounded-lg border border-gray-700 overflow-hidden text-sm font-medium flex-shrink-0" role="tablist">
                        <button @click="breedMode = 'parents'" role="tab" :aria-selected="breedMode === 'parents'"
                                :class="breedMode === 'parents' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'"
                                class="px-3 py-2 transition-colors">Child → Parents</button>
                        <button @click="breedMode = 'child'" role="tab" :aria-selected="breedMode === 'child'"
                                :class="breedMode === 'child' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'"
                                class="px-3 py-2 transition-colors border-l border-gray-700">Parents → Child</button>
                    </div>
                    <p class="text-xs text-gray-400 leading-relaxed">
                        <span x-show="breedMode === 'child'">Pick two parents to see what the egg hatches into, and which of your pals can make it.</span>
                        <span x-show="breedMode === 'parents'">Pick the pal you want. Every pair that produces it is listed, with the ones you can breed right now first.</span>
                    </p>
                </div>

                <!-- Parents -> Child pickers -->
                <div x-show="breedMode === 'child'" class="grid grid-cols-1 md:grid-cols-[1fr_auto_1fr] gap-3 items-end">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-2">Parent A</label>
                        <div x-data="speciesPicker({ placeholder: 'Choose parent A' })" x-modelable="value" x-model="breedA">
                            {{> species-picker }}
                        </div>
                    </div>
                    <button @click="breedSwap()" type="button" title="Swap parents"
                            class="justify-self-center md:mb-1 p-2 rounded-lg bg-gray-700 hover:bg-gray-600 text-gray-300 border border-gray-600 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>
                    </button>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-2">Parent B</label>
                        <div x-data="speciesPicker({ placeholder: 'Choose parent B' })" x-modelable="value" x-model="breedB">
                            {{> species-picker }}
                        </div>
                    </div>
                </div>

                <!-- Child -> Parents picker -->
                <div x-show="breedMode === 'parents'" class="grid grid-cols-1 md:grid-cols-[1fr_auto] gap-3 items-end">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-2">Child</label>
                        <div x-data="speciesPicker({ placeholder: 'Choose the pal you want' })" x-modelable="value" x-model="breedChild">
                            {{> species-picker }}
                        </div>
                    </div>
                    <label class="flex items-center gap-2 text-sm text-gray-300 cursor-pointer select-none md:mb-3 whitespace-nowrap">
                        <input type="checkbox" x-model="breedOwnedOnly" class="rounded border-gray-500 bg-gray-800 text-blue-600 focus:ring-blue-500">
                        Only pairs I can breed now
                    </label>
                </div>

                <!-- Target passives -->
                <div class="mt-4">
                    <label class="block text-xs font-medium text-gray-400 mb-2">
                        Passives you want on the child
                        <span class="text-gray-500 font-normal">(from pals you own; best couples are ranked by how many they carry)</span>
                    </label>
                    <div class="flex flex-wrap items-center gap-2">
                        <template x-for="id in breedTargets" :key="id">
                            <button @click="breedToggleTarget(id)" type="button" title="Remove"
                                    class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border border-emerald-500/50 bg-emerald-500/10 text-emerald-200 hover:bg-emerald-500/20 transition-colors">
                                <span x-text="breedPassiveName(id)"></span>
                                <svg class="w-3 h-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
                            </button>
                        </template>
                        <div class="relative" x-data="{ open: false, q: '' }" @click.away="open = false" @keydown.escape="open = false">
                            <button @click="open = !open; q = ''; $nextTick(() => open && $refs.q.focus())" type="button"
                                    class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border border-dashed border-gray-500 text-gray-300 hover:border-gray-400 hover:text-white transition-colors">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" /></svg>
                                Add passive
                            </button>
                            <div x-show="open" x-cloak
                                 x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                                 x-transition:leave="transition ease-in duration-75" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
                                 class="absolute z-50 mt-1 left-0 w-72 bg-gray-700 border border-gray-600 rounded-lg shadow-xl">
                                <div class="p-2 border-b border-gray-600">
                                    <input type="text" x-ref="q" x-model="q" placeholder="Search passives..."
                                           @keydown.enter.prevent="breedFilteredPassiveOptions(q).length && breedToggleTarget(breedFilteredPassiveOptions(q)[0].id)"
                                           class="w-full px-2.5 py-1.5 bg-gray-800 border border-gray-600 rounded text-sm text-gray-100 placeholder-gray-400 focus:outline-none focus:border-blue-500">
                                </div>
                                <div class="max-h-64 overflow-auto custom-scrollbar py-1">
                                    <template x-for="p in breedFilteredPassiveOptions(q)" :key="p.id">
                                        <div @click="breedToggleTarget(p.id)"
                                             class="px-3 py-1.5 flex items-center gap-2 cursor-pointer text-sm text-gray-100 hover:bg-gray-600 transition-colors">
                                            <img :src="getRankIcon(p.rank)" :style="`filter: ${getRankFilter(p.rank)}`" :alt="'Rank ' + p.rank" class="w-4 h-4 flex-shrink-0">
                                            <span class="flex-1 truncate" x-text="p.name"></span>
                                        </div>
                                    </template>
                                    <div x-show="breedFilteredPassiveOptions(q).length === 0" class="px-3 py-4 text-center text-xs text-gray-400">No matching passives</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div x-show="breedError" class="mb-4 px-4 py-3 rounded-lg bg-red-900/30 border border-red-700/50 text-red-200 text-sm" x-text="breedError"></div>

            <!-- Parents -> Child result -->
            <template x-if="breedMode === 'child'">
                <div>
                    <div x-show="!breedA || !breedB" class="bg-gray-800/40 border border-gray-700/50 border-dashed rounded-xl px-4 py-10 text-center text-gray-400">
                        <div class="font-medium text-gray-300 mb-1">Choose both parents</div>
                        <div class="text-sm">Tick "Owned" in a picker to see only species you have. Two of the same species always make that species.</div>
                    </div>
                    <div x-show="breedA && breedB && !breedLoading && breedResults.length === 0 && !breedError" class="bg-gray-800/40 border border-gray-700/50 rounded-xl px-4 py-8 text-center text-gray-400 text-sm">
                        These two can't breed together. <span x-show="breedSpecies(breedA).ignore_combi || breedSpecies(breedB).ignore_combi">One of them only breeds with its own species.</span>
                    </div>
                    <template x-for="row in breedChildRows()" :key="row.key">
                        <div class="bg-gray-800 rounded-xl border border-gray-700/50 p-4 mb-4">
                            <div class="grid grid-cols-[1fr_auto_1fr] sm:grid-cols-[1fr_auto_1fr_auto_1.4fr] items-center gap-2 sm:gap-3">
                                <template x-for="side in ['a', 'b']" :key="side">
                                    <div class="row-start-1 flex flex-col items-center text-center gap-1.5 min-w-0" :class="side === 'b' ? 'col-start-3' : 'col-start-1'">
                                        <img :src="palIconSrc(breedSpecies(side === 'a' ? row.pair.parent_a : row.pair.parent_b))"
                                             @error="palIconError($el, breedSpecies(side === 'a' ? row.pair.parent_a : row.pair.parent_b))"
                                             class="w-14 h-14 sm:w-20 sm:h-20 rounded-xl bg-gray-900 object-cover">
                                        <div class="text-sm font-medium text-gray-100 truncate max-w-full" x-text="side === 'a' ? row.nameA : row.nameB"></div>
                                        <div x-show="side === 'a' ? row.pair.parent_a_gender : row.pair.parent_b_gender" class="flex items-center gap-1 text-[11px] text-amber-300">
                                            <img :src="(side === 'a' ? row.pair.parent_a_gender : row.pair.parent_b_gender) === 'Male' ? 'img/male.webp' : 'img/female.webp'" class="w-3.5 h-3.5">
                                            <span x-text="side === 'a' ? row.pair.parent_a_gender : row.pair.parent_b_gender"></span>
                                        </div>
                                    </div>
                                </template>
                                <span class="row-start-1 col-start-2 text-2xl text-gray-500 font-light">+</span>
                                <span class="hidden sm:block row-start-1 col-start-4 text-2xl text-gray-500 font-light">=</span>
                                <div class="row-start-2 col-span-3 sm:row-start-1 sm:col-span-1 sm:col-start-5 flex items-center gap-3 min-w-0 rounded-xl border p-2.5 sm:p-3"
                                     :class="row.pair.unique ? 'border-amber-500/40 bg-amber-500/5' : 'border-gray-700 bg-gray-800/80'">
                                    <img :src="palIconSrc(breedSpecies(row.pair.child))" @error="palIconError($el, breedSpecies(row.pair.child))"
                                         class="w-16 h-16 sm:w-24 sm:h-24 rounded-xl bg-gray-900 object-cover flex-shrink-0">
                                    <div class="min-w-0">
                                        <div class="text-base sm:text-xl font-bold text-white truncate" x-text="breedSpecies(row.pair.child).name"></div>
                                        <div class="flex items-center gap-1.5 mt-1 flex-wrap">
                                            <template x-for="el in breedSpecies(row.pair.child).element_types" :key="el">
                                                <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[11px] font-medium text-white" :style="`background:${elementColor(el)}`">
                                                    <img :src="elementIconWhite(el)" :onerror="`this.onerror=null; this.src='/img/neutral_white.webp'`" class="w-3 h-3"><span x-text="elementName(el)"></span>
                                                </span>
                                            </template>
                                            <span x-show="row.pair.unique" class="px-1.5 py-0.5 rounded text-[11px] font-medium bg-amber-500/20 text-amber-200 border border-amber-500/40">Special combo</span>
                                        </div>
                                        <div class="mt-1.5 flex items-center gap-2 text-xs text-gray-400">
                                            <span class="flex items-center gap-1"><img src="img/male.webp" class="w-3.5 h-3.5"><span x-text="breedMaleOdds(row.pair.child) + '%'"></span></span>
                                            <span class="flex items-center gap-1"><img src="img/female.webp" class="w-3.5 h-3.5"><span x-text="(100 - breedMaleOdds(row.pair.child)) + '%'"></span></span>
                                            <button @click="breedHowTo(row.pair.child)" class="ml-auto text-blue-400 hover:text-blue-300 whitespace-nowrap">Other ways to get it →</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            {{> breeding-candidates }}
                        </div>
                    </template>
                </div>
            </template>

            <!-- Child -> Parents result -->
            <template x-if="breedMode === 'parents'">
                <div>
                    <div x-show="!breedChild" class="bg-gray-800/40 border border-gray-700/50 border-dashed rounded-xl px-4 py-10 text-center text-gray-400">
                        <div class="font-medium text-gray-300 mb-1">Choose the pal you want to hatch</div>
                        <div class="text-sm">Or open any pal and press "How to breed".</div>
                    </div>
                    <template x-if="breedChild && !breedLoading">
                        <div>
                            <div class="flex items-center justify-between gap-3 mb-3 px-1 text-sm text-gray-400">
                                <div>
                                    <span class="text-gray-200 font-semibold tabular-nums" x-text="breedPairs.length"></span> pairs make
                                    <span class="text-gray-200 font-semibold" x-text="breedSpecies(breedChild).name"></span>
                                    <span x-show="breedPairs.length">· <span class="text-emerald-300 font-semibold tabular-nums" x-text="breedFeasibleCount()"></span> you can breed now</span>
                                </div>
                                <button @click="breedFrom(breedChild)" class="text-blue-400 hover:text-blue-300 whitespace-nowrap text-xs">Use as a parent →</button>
                            </div>
                            <div x-show="breedRows().length === 0" class="bg-gray-800/40 border border-gray-700/50 rounded-xl px-4 py-8 text-center text-gray-400 text-sm">
                                <span x-show="breedPairs.length && breedOwnedOnly">None of these pairs can be bred from your pals yet. Untick "Only pairs I can breed now" to see them all.</span>
                                <span x-show="!breedPairs.length">No known pair produces this pal.</span>
                            </div>
                            <div class="space-y-2">
                                <template x-for="row in breedVisibleRows()" :key="row.key">
                                    <div class="bg-gray-800 rounded-xl border transition-colors"
                                         :class="row.owned.feasible ? 'border-emerald-500/30' : 'border-gray-700/50'">
                                        <button @click="breedToggleRow(row.key)" class="w-full text-left px-3 py-2.5 flex items-center gap-3">
                                            <template x-for="side in ['a', 'b']" :key="side">
                                                <div class="flex items-center gap-2 min-w-0 flex-1" :class="side === 'b' ? '' : ''">
                                                    <span x-show="side === 'b'" class="text-gray-500 -ml-1">+</span>
                                                    <img :src="palIconSrc(breedSpecies(side === 'a' ? row.pair.parent_a : row.pair.parent_b))"
                                                         @error="palIconError($el, breedSpecies(side === 'a' ? row.pair.parent_a : row.pair.parent_b))" loading="lazy"
                                                         class="w-9 h-9 rounded-lg bg-gray-900 object-cover flex-shrink-0">
                                                    <div class="min-w-0">
                                                        <div class="text-sm font-medium text-gray-100 truncate flex items-center gap-1">
                                                            <span x-text="side === 'a' ? row.nameA : row.nameB"></span>
                                                            <img x-show="side === 'a' ? row.pair.parent_a_gender : row.pair.parent_b_gender"
                                                                 :src="(side === 'a' ? row.pair.parent_a_gender : row.pair.parent_b_gender) === 'Male' ? 'img/male.webp' : 'img/female.webp'"
                                                                 class="w-3.5 h-3.5" :title="'must be ' + (side === 'a' ? row.pair.parent_a_gender : row.pair.parent_b_gender)">
                                                        </div>
                                                        <div class="text-[11px] tabular-nums flex items-center gap-1"
                                                             :class="(side === 'a' ? row.owned.ownsA : row.owned.ownsB) ? 'text-gray-400' : 'text-gray-600'">
                                                            <img src="img/male.webp" class="w-3 h-3 opacity-80"><span x-text="side === 'a' ? row.owned.counts.a.Male : row.owned.counts.b.Male"></span>
                                                            <img src="img/female.webp" class="w-3 h-3 opacity-80 ml-0.5"><span x-text="side === 'a' ? row.owned.counts.a.Female : row.owned.counts.b.Female"></span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                            <div class="flex items-center gap-1.5 flex-shrink-0">
                                                <span x-show="row.pair.unique" class="hidden sm:inline px-1.5 py-0.5 rounded text-[11px] font-medium bg-amber-500/20 text-amber-200 border border-amber-500/40">Special</span>
                                                <span x-show="row.owned.feasible" class="px-1.5 py-0.5 rounded text-[11px] font-medium bg-emerald-500/20 text-emerald-200 border border-emerald-500/40 whitespace-nowrap">
                                                    Breedable<span x-show="breedTargets.length && row.best" class="tabular-nums"> · <span x-text="row.best ? row.best.score : 0"></span>/<span x-text="breedTargets.length"></span></span>
                                                </span>
                                                <svg class="w-4 h-4 text-gray-500 transition-transform" :class="breedIsExpanded(row) ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                                            </div>
                                        </button>
                                        <div x-show="breedIsExpanded(row)" class="px-3 pb-3 -mt-1">
                                            {{> breeding-candidates }}
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <div x-show="breedRows().length > breedLimit" class="mt-3 text-center">
                                <button @click="breedLimit += 50" class="px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 text-sm text-gray-300 hover:bg-gray-700 hover:text-white transition-colors">
                                    Show more (<span x-text="breedRows().length - breedLimit"></span> left)
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <div x-show="breedLoading" class="py-6 text-center text-sm text-gray-400">Looking it up…</div>
        </div>
