        <!-- Overview Tab: the daily check. Who's been on, what needs attention, where the bases are. -->
        <div x-show="currentTab === 'overview' && saveInfo.loaded" class="tab-content" x-data="{ overviewSelectedGuild: null }">
            <!-- Compact stat row -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-5">
                <button @click="currentTab = 'players'" class="stat-card text-left bg-gray-800 rounded-lg px-4 py-3 border border-gray-700 hover:border-gray-500">
                    <div class="text-gray-400 text-xs uppercase tracking-wide mb-0.5">Players</div>
                    <div class="text-2xl font-bold text-gray-100" x-text="saveInfo.player_count"></div>
                </button>
                <button @click="currentTab = 'bases'" class="stat-card text-left bg-gray-800 rounded-lg px-4 py-3 border border-gray-700 hover:border-gray-500">
                    <div class="text-gray-400 text-xs uppercase tracking-wide mb-0.5">Guilds</div>
                    <div class="text-2xl font-bold text-gray-100" x-text="saveInfo.guild_count"></div>
                </button>
                <button @click="currentTab = 'bases'" class="stat-card text-left bg-gray-800 rounded-lg px-4 py-3 border border-gray-700 hover:border-gray-500">
                    <div class="text-gray-400 text-xs uppercase tracking-wide mb-0.5">Bases</div>
                    <div class="text-2xl font-bold text-gray-100" x-text="basePals.reduce((n, g) => n + g.bases.length, 0)"></div>
                </button>
                <button @click="currentTab = 'pals'" class="stat-card text-left bg-gray-800 rounded-lg px-4 py-3 border border-gray-700 hover:border-gray-500">
                    <div class="text-gray-400 text-xs uppercase tracking-wide mb-0.5">Pals</div>
                    <div class="text-2xl font-bold text-gray-100">
                        <span x-text="saveInfo.pal_count"></span>
                        <span class="text-sm font-normal text-gray-400"><span x-text="pals.filter(p => p.base_id).length"></span> at bases</span>
                    </div>
                </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6 mb-6">
                <!-- Players by recent activity -->
                <section class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
                    <header class="px-4 py-3 border-b border-gray-700 flex items-center justify-between">
                        <h2 class="font-bold flex items-center gap-2">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                            </svg>
                            Players
                        </h2>
                        <button @click="currentTab = 'players'" class="text-xs text-blue-300 hover:text-blue-200">All players →</button>
                    </header>
                    <ul class="divide-y divide-gray-700/70">
                        <template x-for="player in playersByActivity" :key="player.uid">
                            <li class="px-4 py-2.5 flex items-center gap-3">
                                <div class="min-w-0 flex-1">
                                    <div class="flex items-center gap-2">
                                        <span class="font-medium text-gray-100 truncate" x-text="player.player_name"></span>
                                        <span class="text-xs text-gray-400 flex-shrink-0">Lv <span x-text="player.level"></span></span>
                                    </div>
                                    <div class="text-xs text-gray-400 truncate">
                                        <span x-text="getGuildName(player.guild_id)"></span>
                                        <template x-if="player.last_online">
                                            <span> · seen <span x-text="formatRelativeTime(player.last_online, now)" :title="formatDate(player.last_online)"></span></span>
                                        </template>
                                    </div>
                                </div>
                                <div class="flex items-center gap-1.5 flex-shrink-0">
                                    <span class="text-xs px-1.5 py-0.5 rounded" :class="needTextClass(player.hunger)" :title="'Hunger ' + Math.round(player.hunger) + '%'">
                                        🍖 <span x-text="Math.round(player.hunger) + '%'"></span>
                                    </span>
                                    <button @click="viewPalsOf(player.player_name)" title="View this player's pals"
                                            class="text-xs px-2 py-1 rounded bg-gray-700/60 hover:bg-gray-700 text-gray-200 border border-gray-600/50">
                                        Pals
                                    </button>
                                </div>
                            </li>
                        </template>
                        <li x-show="players.length === 0" class="px-4 py-6 text-center text-sm text-gray-500">No players in this save</li>
                    </ul>
                </section>

                <!-- Base pals that need attention -->
                <section class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
                    <header class="px-4 py-3 border-b border-gray-700 flex items-center justify-between">
                        <h2 class="font-bold flex items-center gap-2">
                            <svg class="w-5 h-5" :class="unhealthyBasePals.length ? 'text-amber-400' : 'text-gray-400'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
                            </svg>
                            Needs attention
                        </h2>
                        <span class="text-xs px-2 py-0.5 rounded-full"
                              :class="unhealthyBasePals.length ? 'bg-amber-500/20 text-amber-200' : 'bg-gray-700 text-gray-400'"
                              x-text="unhealthyBasePals.length + (unhealthyBasePals.length === 1 ? ' pal' : ' pals')"></span>
                    </header>
                    <ul class="divide-y divide-gray-700/70 max-h-80 overflow-y-auto custom-scrollbar">
                        <template x-for="pal in unhealthyBasePals" :key="pal.instance_id">
                            <li class="px-4 py-2 flex items-center gap-3 hover:bg-gray-700/40 cursor-pointer" @click="$dispatch('open-pal-modal', pal)">
                                <img :src="palIconSrc(pal)" :alt="pal.display_name" @error="palIconError($el, pal)" class="w-9 h-9 rounded-lg bg-gray-900 object-cover flex-shrink-0">
                                <div class="min-w-0 flex-1">
                                    <div class="flex items-center gap-2">
                                        <span class="font-medium text-gray-100 truncate" x-text="pal.nickname || pal.display_name"></span>
                                        <span class="text-xs text-gray-400 flex-shrink-0">Lv <span x-text="pal.level"></span></span>
                                    </div>
                                    <div class="flex items-center gap-2 text-xs">
                                        <span class="px-1.5 py-0.5 rounded"
                                              :class="getConditionClass(pal.all_conditions && pal.all_conditions[0])"
                                              x-text="pal.condition_display"></span>
                                        <button @click.stop="goToBase(pal.guild_id, pal.base_id)" class="text-gray-400 hover:text-blue-300 truncate" x-text="pal.base_name"></button>
                                    </div>
                                </div>
                            </li>
                        </template>
                        <li x-show="unhealthyBasePals.length === 0" class="px-4 py-8 text-center text-sm text-gray-500">
                            <div class="text-green-300 font-medium mb-1">All base pals are healthy</div>
                            Hungry, sick, or injured pals will show up here.
                        </li>
                    </ul>
                </section>

                <!-- Bases by guild -->
                <section class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
                    <header class="px-4 py-3 border-b border-gray-700">
                        <div class="flex items-center justify-between mb-2">
                            <h2 class="font-bold flex items-center gap-2">
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                                </svg>
                                Bases
                            </h2>
                            <button @click="currentTab = 'map'" class="text-xs text-blue-300 hover:text-blue-200">On the map →</button>
                        </div>
                        <!-- Guild pills -->
                        <div class="flex gap-1.5 overflow-x-auto scrollbar-hide -mx-1 px-1"
                             x-effect="if (basePals.length > 0 && !basePals.some(g => g.guild_id === overviewSelectedGuild)) overviewSelectedGuild = basePals[0].guild_id">
                            <template x-for="guild in basePals" :key="guild.guild_id">
                                <button
                                    @click="overviewSelectedGuild = guild.guild_id"
                                    :class="overviewSelectedGuild === guild.guild_id
                                        ? 'bg-blue-600 text-white border-blue-500'
                                        : 'bg-gray-700/50 text-gray-300 border-gray-600 hover:bg-gray-700'"
                                    class="flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-xs font-medium whitespace-nowrap flex-shrink-0">
                                    <span x-text="guild.guild_name"></span>
                                    <span class="px-1.5 rounded-full" :class="overviewSelectedGuild === guild.guild_id ? 'bg-white/20' : 'bg-gray-600'" x-text="guild.bases.length"></span>
                                </button>
                            </template>
                        </div>
                    </header>
                    <div class="p-3 space-y-2">
                        <template x-for="guild in basePals.filter(g => g.guild_id === overviewSelectedGuild)" :key="guild.guild_id">
                            <div class="space-y-2">
                                <template x-for="base in guild.bases" :key="base.base_id">
                                    <button
                                        @click="goToBase(guild.guild_id, base.base_id)"
                                        class="w-full text-left bg-gray-700/30 rounded-lg px-3 py-2.5 border border-gray-600/50 hover:border-blue-500/50 hover:bg-gray-700/50 group flex items-center justify-between gap-3">
                                        <span class="font-medium text-gray-200 group-hover:text-white truncate" x-text="base.base_name"></span>
                                        <span class="flex items-center gap-2 text-xs flex-shrink-0">
                                            <span class="text-gray-400"><span x-text="base.pals.length"></span> pals</span>
                                            <template x-if="base.pals.filter(p => p.condition_display).length > 0">
                                                <span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-200" x-text="base.pals.filter(p => p.condition_display).length + ' unhealthy'"></span>
                                            </template>
                                            <svg class="w-4 h-4 text-gray-500 group-hover:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                                            </svg>
                                        </span>
                                    </button>
                                </template>
                                <template x-if="guild.bases.length === 0">
                                    <p class="text-sm text-gray-500 text-center py-4">This guild has no bases</p>
                                </template>
                            </div>
                        </template>
                        <template x-if="!basePals || basePals.length === 0">
                            <p class="text-sm text-gray-500 text-center py-4">No guilds found</p>
                        </template>
                    </div>
                </section>
            </div>

            <!-- Save file provenance, one quiet line -->
            <p class="text-xs text-gray-500 flex flex-wrap items-center gap-x-3 gap-y-1">
                <span>Reading <span class="font-mono text-gray-400" x-text="saveInfo.level_path"></span> (<span x-text="formatFileSize(saveInfo.file_size)"></span>)</span>
                <span x-show="saveInfo.level_meta_path">and <span class="font-mono text-gray-400" x-text="saveInfo.level_meta_path"></span> (<span x-text="formatFileSize(saveInfo.level_meta_size)"></span>)</span>
                <span x-show="saveInfo.last_updated">· last read <span x-text="formatDate(saveInfo.last_updated)"></span></span>
            </p>
        </div>
