        <!-- Tabs -->
        <nav x-show="saveInfo.loaded" class="mb-4 sm:mb-6" aria-label="Sections">
            <div class="flex gap-1.5 sm:gap-2 overflow-x-auto pb-1 scrollbar-hide">
                <template x-for="tab in tabs" :key="tab.id">
                    <a :href="'#' + tab.id"
                       @click.prevent="currentTab = tab.id"
                       :class="currentTab === tab.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/30' : 'bg-gray-800 text-gray-300 hover:bg-gray-700 hover:text-white border border-gray-700'"
                       :aria-current="currentTab === tab.id ? 'page' : null"
                       class="px-3 py-2 md:px-4 rounded-lg font-medium whitespace-nowrap transition-colors text-sm md:text-base flex-shrink-0 flex items-center gap-1.5">
                        <span x-text="tab.label"></span>
                        <span x-show="tab.count !== null"
                              class="text-xs px-1.5 py-0.5 rounded-full"
                              :class="currentTab === tab.id ? 'bg-white/20' : 'bg-gray-700 text-gray-400'"
                              x-text="tab.count"></span>
                    </a>
                </template>
            </div>
        </nav>
