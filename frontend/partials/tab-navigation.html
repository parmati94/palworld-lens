        <!-- Phone navigation: a fixed bottom tab bar. On md+ the same tabs live in
             the header (header.html). Tools (tool: true) are set off by a hairline. -->
        <nav x-show="saveInfo.loaded" class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-gray-900/95 backdrop-blur-md border-t border-gray-800"
             style="padding-bottom: env(safe-area-inset-bottom);" aria-label="Sections">
            <div class="grid" :style="`grid-template-columns: repeat(${tabs.length}, minmax(0, 1fr))`">
                <template x-for="tab in tabs" :key="tab.id">
                    <a :href="'#' + tab.id"
                       @click.prevent="currentTab = tab.id; window.scrollTo({ top: 0 })"
                       :class="[currentTab === tab.id ? 'text-accent-400' : 'text-gray-500', tab.tool ? 'border-l border-gray-800' : '']"
                       :aria-current="currentTab === tab.id ? 'page' : null"
                       :title="tab.title || tab.label"
                       class="flex flex-col items-center justify-center gap-1 pt-2 pb-1.5 text-[10px] font-medium transition-colors min-w-0">
                        <span class="relative">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" :d="tab.icon" /></svg>
                            <span x-show="currentTab === tab.id" class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-accent-400"></span>
                        </span>
                        <span class="truncate max-w-full" x-text="tab.label"></span>
                    </a>
                </template>
            </div>
        </nav>
