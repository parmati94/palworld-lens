                <!-- Dropdown body (scope: selectMenu component; see js/components/selectMenu.js) -->
                <div class="relative" @click.away="open = false" @keydown.escape="open = false">
                    <button type="button" @click="open = !open"
                            class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-gray-100 text-sm shadow-md hover:bg-gray-650 hover:border-gray-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 transition-all duration-200 cursor-pointer flex items-center justify-between gap-2">
                        <span class="truncate" x-text="label"></span>
                        <svg class="w-4 h-4 flex-shrink-0 transition-transform duration-200" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div x-show="open" x-cloak
                         x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                         x-transition:leave="transition ease-in duration-75" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
                         class="absolute z-50 mt-1 right-0 min-w-full w-max max-w-xs bg-gray-700 border border-gray-600 rounded-lg shadow-xl max-h-60 overflow-auto custom-scrollbar">
                        <template x-for="o in list" :key="o.value">
                            <div @click="pick(o.value)"
                                 class="px-3 py-2 cursor-pointer text-sm transition-colors duration-150 whitespace-nowrap"
                                 :class="value === o.value ? 'bg-blue-600 text-white' : 'text-gray-100 hover:bg-gray-600'"
                                 x-text="o.label"></div>
                        </template>
                    </div>
                </div>
