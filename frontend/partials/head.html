<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palworld Lens</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/img/favicon/favicon.ico?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon/favicon-16x16.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon/favicon-32x32.png?v=2">
    <link rel="apple-touch-icon" href="/img/favicon/apple-touch-icon.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/favicon/android-chrome-192x192.png?v=2">
    <link rel="icon" type="image/png" sizes="512x512" href="/img/favicon/android-chrome-512x512.png?v=2">
    
    <!-- Saved accent + motion preference, applied before first paint (see Settings in js/app.js) -->
    <script>
        try {
            var prefs = JSON.parse(localStorage.getItem('palworld-lens:prefs') || '{}');
            if (prefs.theme) document.documentElement.setAttribute('data-theme', prefs.theme);
            if (prefs.reduceMotion) document.documentElement.classList.add('reduce-motion');
        } catch (e) {}
    </script>
    <!-- Tailwind CSS (built with PostCSS) -->
    <link rel="stylesheet" href="/css/styles.css">

    <!-- Main application bundle (includes Alpine.js) -->
    <script type="module" src="/js/main.js" defer></script>
</head>
